name: CMake Build and Test (macOS)

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'Config.cmake.in'
      - 'config.h.in'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'tests/**/CMakeLists.txt'
      - 'tests/**/*.cmake'
      - 'tests/**/*.cpp'
      - 'tests/**/*.h'
      - 'tests/**/*.hpp'
      - 'examples/CMakeLists.txt'
      - 'examples/apiserver/**'
      - 'examples/chatserver/**'
      - '.github/workflows/macos_build.yaml'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'Config.cmake.in'
      - 'config.h.in'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'tests/**/CMakeLists.txt'
      - 'tests/**/*.cmake'
      - 'tests/**/*.cpp'
      - 'tests/**/*.h'
      - 'tests/**/*.hpp'
      - 'examples/CMakeLists.txt'
      - 'examples/apiserver/**'
      - 'examples/chatserver/**'
      - '.github/workflows/macos_build.yaml'
      - '!**/*.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          brew update
          brew install cmake boost openssl zlib googletest

      - name: Configure CMake
        run: cmake -DYAHAT_STATIC_BOOST=OFF -DYAHAT_WITH_TESTS=ON -DYAHAT_WITH_EXAMPLES=ON -DYAHAT_ENABLE_METRICS=ON -S . -B build

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
