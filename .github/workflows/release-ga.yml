name: Release GA

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication; a queued run will fail if its version was just released.
concurrency:
  group: release-ga
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Create GA release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Require main
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Run Release GA from the main branch." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release metadata
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^[[:space:]]*set\(YAHAT_VERSION[[:space:]]+"?([0-9]+\.[0-9]+\.[0-9]+)"?\)[[:space:]]*(#.*)?$/\1/p' CMakeLists.txt)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected one literal GA version (MAJOR.MINOR.PATCH) in CMakeLists.txt." >&2
            exit 1
          fi
          tag="v${version}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "Tag ${tag} already exists; update YAHAT_VERSION before releasing." >&2
            exit 1
          fi

          main_sha="$(git rev-parse HEAD)"
          # List releases so an empty repository is distinct from an API failure.
          # Drafts/prereleases do not establish the previous GA release boundary.
          previous_tag="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[][] | select(.draft == false and .prerelease == false)] | max_by(.published_at) | .tag_name // empty')"
          previous_sha=""
          if [[ -n "$previous_tag" ]]; then
            previous_sha="$(git rev-parse --verify "refs/tags/${previous_tag}^{commit}")"
            if ! git merge-base --is-ancestor "$previous_sha" "$main_sha"; then
              echo "Previous release ${previous_tag} is not an ancestor of main." >&2
              exit 1
            fi
          fi
          {
            echo "tag=${tag}"
            echo "main_sha=${main_sha}"
            echo "previous_sha=${previous_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        env:
          MAIN_SHA: ${{ steps.prep.outputs.main_sha }}
          PREVIOUS_SHA: ${{ steps.prep.outputs.previous_sha }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          {
            echo "## Changes"
            echo
            if [[ -n "$PREVIOUS_SHA" ]]; then
              git log --reverse --format='- %s (%h)' "${PREVIOUS_SHA}..${MAIN_SHA}"
            else
              git log --reverse --format='- %s (%h)' "$MAIN_SHA"
            fi
          } > "$notes_file"
          echo "notes_file=${notes_file}" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prep.outputs.tag }}
          MAIN_SHA: ${{ steps.prep.outputs.main_sha }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          set -euo pipefail
          # Creating the ref through the API also rejects a tag created since checkout.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" -f "sha=${MAIN_SHA}" > /dev/null
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$TAG" --notes-file "$NOTES_FILE" --latest
