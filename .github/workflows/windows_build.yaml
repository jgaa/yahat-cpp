name: CMake Build and Test (Windows)

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'Config.cmake.in'
      - 'config.h.in'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'tests/**/CMakeLists.txt'
      - 'tests/**/*.cmake'
      - 'tests/**/*.cpp'
      - 'tests/**/*.h'
      - 'tests/**/*.hpp'
      - 'examples/CMakeLists.txt'
      - 'examples/apiserver/**'
      - 'examples/chatserver/**'
      - '.github/workflows/windows_build.yaml'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'Config.cmake.in'
      - 'config.h.in'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'tests/**/CMakeLists.txt'
      - 'tests/**/*.cmake'
      - 'tests/**/*.cpp'
      - 'tests/**/*.h'
      - 'tests/**/*.hpp'
      - 'examples/CMakeLists.txt'
      - 'examples/apiserver/**'
      - 'examples/chatserver/**'
      - '.github/workflows/windows_build.yaml'
      - '!**/*.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # This image supplies CMake >= 4.2, required by the VS 2026 generator.
      - name: Show CMake version
        run: cmake --version

      - name: Install vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.bat

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v6
        with:
          path: vcpkg/installed
          key: ${{ runner.os }}-${{ runner.arch }}-vs2026-vcpkg-boost-slim

      - name: Install dependencies with vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          ./vcpkg/vcpkg.exe install \
            zlib:x64-windows \
            openssl:x64-windows \
            gtest:x64-windows \
            boost-system:x64-windows \
            boost-program-options:x64-windows \
            boost-coroutine:x64-windows \
            boost-context:x64-windows \
            boost-chrono:x64-windows \
            boost-json:x64-windows \
            boost-url:x64-windows \
            boost-asio:x64-windows \
            boost-beast:x64-windows \
            boost-circular-buffer:x64-windows \
            boost-uuid:x64-windows

      - name: Configure CMake
        run: |
          cmake \
            -G "Visual Studio 18 2026" \
            -A x64 \
            -D_WIN32_WINNT=0x0A00 \
            -DYAHAT_WITH_TESTS=ON \
            -DYAHAT_WITH_EXAMPLES=ON \
            -DYAHAT_ENABLE_METRICS=ON \
            -DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake \
            -S . \
            -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest -C Release --test-dir build --output-on-failure
